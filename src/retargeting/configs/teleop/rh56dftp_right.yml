retargeting:
  type: vector
  urdf_path: rh56dftp/rh56dftp_modified_right.urdf

  # Target refers to the retargeting target, which is the robot hand
  target_joint_names: [ 'right_little_1_joint',
                        'right_ring_1_joint',
                        'right_middle_1_joint',
                        'right_index_1_joint',
                        'right_thumb_1_joint',
                        'right_thumb_2_joint' ]

  target_origin_link_names: [ "human_wrist_link",
                              "human_wrist_link",
                              "human_wrist_link",
                              "human_wrist_link",
                              "human_wrist_link" ]

  target_task_link_names: [ "right_thumb_force_sensor_3",
                            "right_index_force_sensor_3",
                            "right_middle_force_sensor_3",
                            "right_ring_force_sensor_3",
                            "right_little_force_sensor_3" ]
  scaling_factor: 1.0

  # Source refers to the retargeting input, which usually corresponds to the human hand
  # The joint indices of human hand joint which corresponds to each link in the target_link_names
  target_link_human_indices: [ [ 0, 0, 0, 0, 0 ], [ 4, 8, 12, 16, 20 ] ]

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 0.2
